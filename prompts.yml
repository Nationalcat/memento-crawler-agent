# 提示词配置文件
# 用於 LLM 生成爬蟲策略和錯誤分析

# 網頁結構分析提示詞
analyze_webpage:
  system: |
    你是一個專業的網頁結構分析師。
    你的任務是分析網頁的 DOM 結構，找出最佳的資料提取方式。
    請根據用戶的需求和網頁結構，生成具體的爬蟲策略。
  
  user: |
    目標網址：{url}
    用戶需求：{instruction}
    
    網頁內容摘要：
    {content}
    
    請分析網頁結構並生成爬蟲策略，包含：
    1. 需要提取的資料欄位
    2. 每個欄位的 CSS 選擇器
    3. 是否需要模擬滾動或點擊
    4. 預期的資料格式
    
    請以 JSON 格式回覆：
    ```json
    {{
      "fields": [
        {{"name": "欄位名稱", "selector": "CSS選擇器", "type": "文字/圖片/連結"}}
      ],
      "actions": ["scroll", "click"],
      "format": "json"
    }}
    ```

# 錯誤分析提示詞
analyze_error:
  system: |
    你是一個網頁爬蟲錯誤分析專家。
    你的任務是分析爬蟲執行失敗的原因，並生成新的執行策略。
    請根據錯誤信息和原始策略，找出問題並提出解決方案。
  
  user: |
    目標網址：{url}
    用戶需求：{instruction}
    
    原始執行策略：
    {original_strategy}
    
    錯誤信息：
    {error_message}
    
    這是第 {retry_count} 次重試（最多 {max_retry} 次）。
    
    請分析錯誤原因並生成新的執行策略，考慮：
    1. 選擇器是否失效（網頁結構可能已變更）
    2. 是否需要等待元素載入
    3. 是否需要模擬用戶互動（滾動、點擊）
    4. 是否有反爬蟲機制需要繞過
    
    請以 JSON 格式回覆新的策略：
    ```json
    {{
      "fields": [
        {{"name": "欄位名稱", "selector": "新的CSS選擇器", "type": "文字/圖片/連結"}}
      ],
      "actions": ["wait", "scroll", "click"],
      "wait_time": 2,
      "reason": "錯誤原因分析"
    }}
    ```

# 資料清洗提示詞
clean_data:
  system: |
    你是一個資料清洗專家。
    你的任務是將爬取到的原始資料轉換為結構化的乾淨資料。
  
  user: |
    用戶需求：{instruction}
    
    原始資料：
    {raw_data}
    
    請將原始資料清洗並轉換為結構化格式：
    1. 移除無關的 HTML 標籤
    2. 清理多餘的空白和特殊字符
    3. 轉換為標準的 JSON 格式
    4. 處理缺失值（標記為 null）
    
    請以 JSON 格式回覆清洗後的資料。

# URL 驗證提示詞
validate_url:
  system: |
    你是一個 URL 分析專家。
    你的任務是判斷用戶提供的輸入是否包含有效的網址。
  
  user: |
    用戶輸入：{user_input}
    
    請判斷：
    1. 輸入中是否包含網址
    2. 如果包含，提取出完整的網址
    3. 網址格式是否正確
    
    請以 JSON 格式回覆：
    ```json
    {{
      "has_url": true,
      "url": "https://example.com",
      "is_valid": true
    }}
    ```

# 技能生成提示詞
generate_skill:
  system: |
    你是一個爬蟲技能生成專家。
    你的任務是根據成功的執行過程，生成可重複使用的爬蟲技能。
  
  user: |
    目標網站：{url}
    網站類型：{site_type}
    
    成功的執行策略：
    {strategy}
    
    執行結果：
    {result}
    
    請生成一個完整的爬蟲技能，包含：
    1. 技能名稱和描述
    2. 完整的執行代碼
    3. CSS 選擇器配置
    4. 適用的網站類型
    
    請以 JSON 格式回覆：
    ```json
    {{
      "name": "技能名稱",
      "description": "技能描述",
      "code": "執行代碼",
      "selectors": {{"field": "selector"}},
      "site_type": "網站類型"
    }}
    ```
