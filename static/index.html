<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memento-Skills 爬蟲 Agent</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #fff;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 30px 0;
        }

        h1 {
            font-size: 2.5em;
            background: linear-gradient(90deg, #00d2ff, #3a7bd5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #8892b0;
            font-size: 1.1em;
        }

        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 30px;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 25px;
            backdrop-filter: blur(10px);
        }

        .card h2 {
            font-size: 1.3em;
            margin-bottom: 20px;
            color: #64ffda;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card h2::before {
            content: '';
            display: inline-block;
            width: 4px;
            height: 20px;
            background: #64ffda;
            border-radius: 2px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #8892b0;
            font-size: 0.9em;
        }

        input, textarea {
            width: 100%;
            padding: 12px 15px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: #fff;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: #64ffda;
        }

        textarea {
            height: 100px;
            resize: vertical;
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
        }

        .btn-primary {
            background: linear-gradient(90deg, #00d2ff, #3a7bd5);
            color: #fff;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 210, 255, 0.3);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-danger {
            background: linear-gradient(90deg, #ff6b6b, #ee5a24);
            color: #fff;
        }

        .btn-warning {
            background: linear-gradient(90deg, #f39c12, #e67e22);
            color: #fff;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .status-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 8px;
        }

        .status-connected {
            background: #64ffda;
            box-shadow: 0 0 10px #64ffda;
        }

        .status-disconnected {
            background: #ff6b6b;
            box-shadow: 0 0 10px #ff6b6b;
        }

        .status-info {
            display: flex;
            align-items: center;
            padding: 10px 15px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 0.9em;
        }

        .log-container {
            height: 400px;
            overflow-y: auto;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            padding: 15px;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 0.85em;
            line-height: 1.6;
        }

        .log-entry {
            padding: 5px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .log-time {
            color: #64ffda;
            margin-right: 10px;
        }

        .log-status {
            color: #ffd700;
        }

        .log-error {
            color: #ff6b6b;
        }

        .log-success {
            color: #64ffda;
        }

        .log-info {
            color: #8892b0;
        }

        .log-retry {
            color: #f39c12;
        }

        .session-info {
            background: rgba(100, 255, 218, 0.1);
            border: 1px solid rgba(100, 255, 218, 0.3);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .session-id {
            font-family: 'Consolas', monospace;
            color: #64ffda;
            word-break: break-all;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 15px;
        }

        .stat-item {
            text-align: center;
            padding: 15px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 8px;
        }

        .stat-value {
            font-size: 1.8em;
            font-weight: bold;
            color: #64ffda;
        }

        .stat-label {
            font-size: 0.8em;
            color: #8892b0;
            margin-top: 5px;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        /* 拒絕任務提示框 */
        .reject-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .reject-overlay.active {
            display: flex;
        }

        .reject-dialog {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            border: 1px solid rgba(255, 107, 107, 0.5);
            border-radius: 15px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            text-align: center;
        }

        .reject-icon {
            font-size: 3em;
            margin-bottom: 15px;
        }

        .reject-title {
            font-size: 1.3em;
            color: #ff6b6b;
            margin-bottom: 10px;
        }

        .reject-message {
            color: #8892b0;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .reject-status-code {
            font-family: 'Consolas', monospace;
            color: #ff6b6b;
            background: rgba(255, 107, 107, 0.1);
            padding: 5px 10px;
            border-radius: 5px;
            display: inline-block;
            margin-bottom: 20px;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .loading {
            animation: pulse 1.5s infinite;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(100, 255, 218, 0.3);
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Memento-Skills 爬蟲 Agent</h1>
            <p class="subtitle">具備自主學習能力的電商爬蟲系統</p>
        </header>

        <div class="main-grid">
            <!-- 左側：任務輸入 -->
            <div class="card">
                <h2>任務設定</h2>

                <div class="session-info">
                    <div>會話 ID：<span id="sessionId" class="session-id">未連接</span></div>
                    <div style="margin-top: 8px;">
                        狀態：<span class="status-indicator status-disconnected" id="statusDot"></span>
                        <span id="connectionStatus">未連接</span>
                    </div>
                </div>

                <div class="form-group">
                    <label for="url">目標網址</label>
                    <input type="text" id="url" placeholder="example.com 或 https://www.example.com/products">
                </div>

                <div class="form-group">
                    <label for="instruction">自然語言指令</label>
                    <textarea id="instruction" placeholder="請輸入爬蟲指令，例如：抓取所有商品名稱、價格和評價"></textarea>
                </div>

                <div class="btn-group">
                    <button class="btn btn-primary" id="startBtn" onclick="startTask()" disabled>
                        開始執行
                    </button>
                    <button class="btn btn-danger" id="cancelBtn" onclick="cancelTask()" disabled>
                        取消任務
                    </button>
                </div>

                <!-- 統計資訊 -->
                <div class="stats-grid">
                    <div class="stat-item">
                        <div class="stat-value" id="taskCount">0</div>
                        <div class="stat-label">任務數量</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="extractedCount">0</div>
                        <div class="stat-label">提取資料</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="retryCount">0</div>
                        <div class="stat-label">重試次數</div>
                    </div>
                </div>
            </div>

            <!-- 右側：執行日誌 -->
            <div class="card">
                <h2>執行日誌</h2>
                <div class="log-container" id="logContainer">
                    <div class="log-entry">
                        <span class="log-time">[系統]</span>
                        <span class="log-info">等待連接...</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 拒絕任務提示框 -->
    <div class="reject-overlay" id="rejectOverlay">
        <div class="reject-dialog">
            <div class="reject-icon">❌</div>
            <div class="reject-title" id="rejectTitle">任務被拒絕</div>
            <div class="reject-message" id="rejectMessage">請提供有效的網址</div>
            <div class="reject-status-code" id="rejectStatusCode" style="display: none;"></div>
            <div class="btn-group" style="justify-content: center;">
                <button class="btn btn-warning" onclick="retryWithNewUrl()">
                    重新輸入網址
                </button>
                <button class="btn btn-danger" onclick="closeRejectDialog()">
                    取消任務
                </button>
            </div>
        </div>
    </div>

    <script>
        // 全域變數
        let ws = null;
        let sessionId = null;
        let taskCount = 0;
        let extractedCount = 0;
        let retryCount = 0;

        // 頁面載入時建立會話
        window.onload = async function() {
            await createSession();
        };

        // 建立會話
        async function createSession() {
            try {
                const response = await fetch('/api/session/create', {
                    method: 'POST'
                });
                const data = await response.json();
                sessionId = data.session_id;

                document.getElementById('sessionId').textContent = sessionId;
                addLog('系統', '會話建立成功', 'info');

                // 連接 WebSocket
                connectWebSocket();
            } catch (error) {
                addLog('錯誤', '建立會話失敗: ' + error.message, 'error');
            }
        }

        // 連接 WebSocket
        function connectWebSocket() {
            const wsUrl = `ws://${window.location.host}/ws/${sessionId}`;
            ws = new WebSocket(wsUrl);

            ws.onopen = function() {
                document.getElementById('statusDot').className = 'status-indicator status-connected';
                document.getElementById('connectionStatus').textContent = '已連接';
                document.getElementById('startBtn').disabled = false;
                addLog('系統', 'WebSocket 連接成功', 'success');
            };

            ws.onmessage = function(event) {
                const data = JSON.parse(event.data);
                handleServerMessage(data);
            };

            ws.onclose = function() {
                document.getElementById('statusDot').className = 'status-indicator status-disconnected';
                document.getElementById('connectionStatus').textContent = '已斷開';
                document.getElementById('startBtn').disabled = true;
                addLog('系統', 'WebSocket 連線斷開', 'error');
            };

            ws.onerror = function(error) {
                addLog('錯誤', 'WebSocket 錯誤', 'error');
            };
        }

        // 處理伺服器訊息
        function handleServerMessage(data) {
            switch(data.type) {
                case 'connected':
                    addLog('系統', data.message, 'success');
                    break;

                case 'status_update':
                    handleStatusUpdate(data);
                    break;

                case 'task_started':
                    addLog('任務', '任務開始執行', 'info');
                    addLog('任務', `目標: ${data.url}`, 'info');
                    addLog('任務', `指令: ${data.instruction}`, 'info');
                    document.getElementById('cancelBtn').disabled = false;
                    document.getElementById('startBtn').disabled = true;
                    break;

                case 'task_completed':
                    handleTaskCompleted(data);
                    break;

                case 'task_error':
                    addLog('錯誤', data.message, 'error');
                    document.getElementById('startBtn').disabled = false;
                    document.getElementById('cancelBtn').disabled = true;
                    break;

                case 'task_cancelled':
                    addLog('系統', data.message, 'info');
                    document.getElementById('startBtn').disabled = false;
                    document.getElementById('cancelBtn').disabled = true;
                    break;

                case 'reject_task':
                    handleRejectTask(data);
                    break;

                case 'pong':
                    // 心跳回應
                    break;

                case 'error':
                    addLog('錯誤', data.message, 'error');
                    break;

                default:
                    addLog('系統', JSON.stringify(data), 'info');
            }
        }

        // 處理狀態更新
        function handleStatusUpdate(data) {
            const statusText = getStatusText(data.status);
            addLog('狀態', `${statusText} - 步驟 ${data.current_step}/${data.total_steps}`, 'status');

            if (data.extracted_data_count > 0) {
                extractedCount = data.extracted_data_count;
                updateStats();
            }

            // 顯示重試進度
            if (data.retry_progress) {
                addLog('重試', data.retry_progress, 'retry');
                retryCount++;
                updateStats();
            }
        }

        // 處理任務完成
        function handleTaskCompleted(data) {
            const statusText = getStatusText(data.status);
            addLog('完成', `任務 ${data.task_id} ${statusText}`, 'success');

            if (data.extracted_data && data.extracted_data.length > 0) {
                addLog('資料', `提取 ${data.extracted_data.length} 筆資料`, 'success');
                extractedCount = data.extracted_data.length;
            }

            if (data.error_log && data.error_log.length > 0) {
                data.error_log.forEach(error => {
                    addLog('錯誤', error, 'error');
                });
            }

            if (data.retry_count > 0) {
                addLog('系統', `總重試次數: ${data.retry_count}`, 'info');
            }

            // 顯示技能更新狀態
            if (data.skill_action === 'created') {
                addLog('技能', `已保存新技能: ${data.skill_id}`, 'success');
            } else if (data.skill_action === 'updated') {
                addLog('技能', `已更新技能: ${data.skill_id}`, 'success');
            }

            taskCount++;
            updateStats();
            document.getElementById('startBtn').disabled = false;
            document.getElementById('cancelBtn').disabled = true;
        }

        // 處理任務拒絕
        function handleRejectTask(data) {
            const title = data.reason === 'url_empty' ? '缺少網址' :
                         data.reason === 'url_inaccessible' ? '頁面無法訪問' :
                         '任務被拒絕';

            document.getElementById('rejectTitle').textContent = title;
            document.getElementById('rejectMessage').textContent = data.message;

            // 顯示狀態碼
            const statusCodeEl = document.getElementById('rejectStatusCode');
            if (data.status_code) {
                statusCodeEl.textContent = `HTTP ${data.status_code}`;
                statusCodeEl.style.display = 'inline-block';
            } else {
                statusCodeEl.style.display = 'none';
            }

            // 顯示提示框
            document.getElementById('rejectOverlay').classList.add('active');

            addLog('拒絕', `${title}: ${data.message}`, 'error');
        }

        // 使用新 URL 重試
        function retryWithNewUrl() {
            closeRejectDialog();
            document.getElementById('url').value = '';
            document.getElementById('url').focus();
            addLog('系統', '請輸入新的網址', 'info');
        }

        // 關閉拒絕對話框
        function closeRejectDialog() {
            document.getElementById('rejectOverlay').classList.remove('active');
            document.getElementById('startBtn').disabled = false;
            document.getElementById('cancelBtn').disabled = true;
        }

        // 獲取狀態文字
        function getStatusText(status) {
            const statusMap = {
                'pending': '待處理',
                'parsing': '解析中',
                'skill_loading': '技能載入中',
                'executing': '執行中',
                'extracting': '提取中',
                'reflecting': '反思中',
                'completed': '已完成',
                'failed': '已失敗',
                'rejected': '已拒絕'
            };
            return statusMap[status] || status;
        }

        // 開始任務
        async function startTask() {
            const url = document.getElementById('url').value;
            const instruction = document.getElementById('instruction').value;

            if (!url || !instruction) {
                addLog('錯誤', '請輸入網址和指令', 'error');
                return;
            }

            document.getElementById('startBtn').disabled = true;

            ws.send(JSON.stringify({
                type: 'start_task',
                url: url,
                instruction: instruction
            }));
        }

        // 取消任務
        async function cancelTask() {
            ws.send(JSON.stringify({
                type: 'cancel_task'
            }));
        }

        // 新增日誌
        function addLog(prefix, message, type = 'info') {
            const logContainer = document.getElementById('logContainer');
            const time = new Date().toLocaleTimeString();

            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.innerHTML = `
                <span class="log-time">[${time}]</span>
                <span class="log-${type}">[${prefix}] ${message}</span>
            `;

            logContainer.appendChild(entry);
            logContainer.scrollTop = logContainer.scrollHeight;
        }

        // 更新統計
        function updateStats() {
            document.getElementById('taskCount').textContent = taskCount;
            document.getElementById('extractedCount').textContent = extractedCount;
            document.getElementById('retryCount').textContent = retryCount;
        }

        // 心跳檢測
        setInterval(function() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'ping' }));
            }
        }, 30000);
    </script>
</body>
</html>
